name: SNESticleAurora vN214 Seven Mapper PS2 Release Candidate
on:
  push:
    branches: ['experiment/seven-mappers-vn214-release-candidate']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-ps2-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Pin latest seven-mapper QuickNES integration
        run: |
          test "$(git -C src/third_party/quicknes rev-parse HEAD)" = "3ee9a39c528c3a774222bd41b9c22dfb1f4faa67"
          for f in aurora_vn106_mapper219.hpp aurora_vn107_mapper249.hpp aurora_vN118_mapper35_209_FAST_CANDIDATE.hpp aurora_vn71_mapper272_CANDIDATE.hpp aurora_vn66_mapper540_quicknes_CANDIDATE.hpp aurora_vn71_mapper558_CANDIDATE.hpp; do
            test -f "src/third_party/quicknes/nes_emu/mappers/$f"
          done
      - name: Compile full PS2 SNESticleAurora including QuickNES
        run: make -j8 AUTO_INSTALL=yes LTO_LINK_JOBS=2
      - name: Check full SNESticle ELF exists
        run: find . -type f -name 'SNESticle*.elf' -size +64k | grep -q .
      - uses: actions/upload-artifact@v4
        with:
          name: SNESticleAurora-vN214-SEVEN-MAPPERS-PS2-EXPERIMENTAL
          path: '**/SNESticle*.elf'
          if-no-files-found: error
